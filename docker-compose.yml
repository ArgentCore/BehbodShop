services:
  postgres:
    image: postgres:16-alpine
    container_name: behbodshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: behbod
      POSTGRES_PASSWORD: behbod_dev_password
      POSTGRES_DB: behbodshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: