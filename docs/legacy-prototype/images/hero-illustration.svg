<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="محصولات چرم دست‌دوز بهبد">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ecdb"/>
      <stop offset="100%" stop-color="#e7d3ac"/>
    </linearGradient>
    <linearGradient id="heroLeatherA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4f1f"/>
      <stop offset="100%" stop-color="#5a2d0c"/>
    </linearGradient>
    <linearGradient id="heroLeatherB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3a15"/>
      <stop offset="100%" stop-color="#43220a"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="280" r="260" fill="url(#heroBg)"/>

  <!-- shoulder bag -->
  <g transform="translate(220,230)">
    <path d="M -95 -110 L 60 90" stroke="#3d1e08" stroke-width="11" stroke-linecap="round" fill="none"/>
    <rect x="-108" y="-38" width="216" height="132" rx="18" fill="url(#heroLeatherA)"/>
    <path d="M -108 -38 Q 0 -76 108 -38 L 108 -8 Q 0 -46 -108 -8 Z" fill="#3d1e08" opacity="0.5"/>
    <circle cx="0" cy="-16" r="9" fill="#A67C00"/>
    <rect x="-108" y="-38" width="216" height="132" rx="18" fill="none" stroke="#e9d8c3" stroke-width="2" stroke-dasharray="7 6" opacity="0.5"/>
  </g>

  <!-- wallet -->
  <g transform="translate(410,340) rotate(8)">
    <rect x="-70" y="-46" width="140" height="92" rx="14" fill="url(#heroLeatherB)"/>
    <rect x="-58" y="-34" width="116" height="68" rx="9" fill="none" stroke="#e9d8c3" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5"/>
    <circle cx="55" cy="0" r="7" fill="#A67C00"/>
  </g>

  <!-- belt accent -->
  <g transform="translate(180,420) rotate(-10)">
    <rect x="-120" y="-16" width="240" height="32" rx="6" fill="url(#heroLeatherB)"/>
    <rect x="70" y="-24" width="46" height="48" rx="8" fill="#A67C00"/>
    <rect x="82" y="-12" width="22" height="24" rx="4" fill="none" stroke="#5a2d0c" stroke-width="3"/>
  </g>

  <!-- decorative stitches -->
  <g stroke="#A67C00" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.6">
    <circle cx="300" cy="280" r="230" fill="none"/>
  </g>
</svg>
